<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f9f5" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved or system theme before the first paint. Keep in sync with useTheme.
      (() => {
        let preference;
        try { preference = localStorage.getItem('local-repos:theme'); } catch {}
        const dark = preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#181d17' : '#f8f9f5';
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Local Repos brings your local projects together. Enable JavaScript to browse repositories and connect a directory. Your workspace is stored in this browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
